<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam Chart Explorer</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <main class="container">
      <header>
        <p class="eyebrow">Steam data project</p>
        <h1>Steam Chart Explorer</h1>
        <p>Select a month to retrieve and visualize weekly Top Seller chart data.</p>
      </header>

      <section class="controls" aria-label="Chart filters">
        <label>Month <input id="month" type="month" required /></label>
        <label>Region
          <select id="region">
            <option value="US">United States</option>
            <option value="global">Global</option>
            <option value="GB">United Kingdom</option>
          </select>
        </label>
        <button id="load-button">Load charts</button>
      </section>

      <p id="status" role="status">Choose a month, then load the chart data.</p>

      <section class="dashboard" aria-label="Steam data dashboard">
        <article class="card"><h2>Weekly chart appearances</h2><canvas id="appearances-chart"></canvas></article>
        <article class="card"><h2>Average rank</h2><canvas id="rank-chart"></canvas></article>
      </section>

      <section class="card">
        <h2>Collected records</h2>
        <table>
          <thead><tr><th>Date</th><th>Rank</th><th>Game</th><th>Price</th><th>Weeks on Chart</th></tr></thead>
          <tbody id="results"></tbody>
        </table>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
